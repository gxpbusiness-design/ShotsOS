<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>On set · Shot list</title>
<style>
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --surface-2:#EAEAEA; --ink:#000; --muted:#6B6B6B; --line:#DADADA; --line-soft:#EDEDED;
  --accent:#000; --on-accent:#fff; --scene:#000; --scene-ink:#fff;
  --st-hold:#FFF3BF; --st-hold-b:#E6CE63; --st-done:#DCF2DE; --st-done-b:#8FCB97; --st-difficult:#FAD9D7; --st-difficult-b:#E2948E; --st-reshoot:#FFDFC8; --st-reshoot-b:#EFA06C;
  --check:#1E8E3E;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --surface:#141414; --surface-2:#1F1F1F; --ink:#fff; --muted:#9A9A9A; --line:#2E2E2E; --line-soft:#1F1F1F;
    --accent:#fff; --on-accent:#000; --scene:#fff; --scene-ink:#000;
    --st-hold:#3A3315; --st-hold-b:#7A6A22; --st-done:#16301B; --st-done-b:#2F6B3A; --st-difficult:#3A1918; --st-difficult-b:#7D3330; --st-reshoot:#3B2313; --st-reshoot-b:#8A4D24;
    --check:#4CC46A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --surface:#141414; --surface-2:#1F1F1F; --ink:#fff; --muted:#9A9A9A; --line:#2E2E2E; --line-soft:#1F1F1F;
  --accent:#fff; --on-accent:#000; --scene:#fff; --scene-ink:#000;
  --st-hold:#3A3315; --st-hold-b:#7A6A22; --st-done:#16301B; --st-done-b:#2F6B3A; --st-difficult:#3A1918; --st-difficult-b:#7D3330; --st-reshoot:#3B2313; --st-reshoot-b:#8A4D24;
  --check:#4CC46A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{--padL:max(14px, env(safe-area-inset-left,0px));--padR:max(14px, env(safe-area-inset-right,0px))}
html{scroll-padding-top:200px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top,0px)) var(--padR) 10px var(--padL);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:12px}
.tl{flex:1;min-width:0}
.ttl{font-size:24px;font-weight:750;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon svg{width:22px;height:22px}
.prog{margin-top:10px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--check);border-radius:4px;transition:width .35s ease}
.pnums{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.pnums b{color:var(--ink);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px calc(-1 * var(--padR)) 0 calc(-1 * var(--padL));padding:0 var(--padR) 2px var(--padL);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer;max-width:240px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.01em}
.chip small{font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on small{color:inherit;opacity:.7}
.chip .dot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--scene)}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;margin-top:10px}
.seg button{flex:1;height:34px;border:0;background:transparent;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* list */
main{padding:6px var(--padR) 0 var(--padL);max-width:760px;margin:0 auto}
.scene{display:flex;align-items:center;gap:10px;margin:16px 0 8px;padding:0 14px;height:46px;border-radius:14px;background:var(--scene);color:var(--scene-ink);--scene-muted:color-mix(in srgb,currentColor 65%,transparent)}
.scene b{flex:1;min-width:0;font-size:14.5px;font-weight:720;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene small{font-size:12.5px;color:var(--scene-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.scene.compact{height:40px;opacity:.75}
[data-tod="day"]{background:radial-gradient(circle at 72% 50%,#FFE58A 0 7px,rgba(255,229,138,.55) 8px,rgba(255,229,138,0) 22px),linear-gradient(100deg,#4FAEF0,#8FD0FF 55%,#CBEAFF);color:#08182B}
[data-tod="sunset"]{background:linear-gradient(100deg,#3D1D5C,#B23F63 40%,#F29A58 78%,#FFD584);color:#fff}
[data-tod="night"]{background:radial-gradient(1.4px 1.4px at 8% 30%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 20% 70%,rgba(255,255,255,.8) 50%,transparent 60%),radial-gradient(1.3px 1.3px at 34% 22%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 47% 64%,rgba(255,255,255,.75) 50%,transparent 60%),radial-gradient(1.5px 1.5px at 59% 28%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 79% 72%,rgba(255,255,255,.7) 50%,transparent 60%),radial-gradient(1.3px 1.3px at 92% 24%,#fff 50%,transparent 60%),radial-gradient(circle at 70% 42%,rgba(255,255,255,.95) 0 4px,rgba(255,255,255,0) 5px),linear-gradient(100deg,#070F2E,#132A66 60%,#1E3A7A);color:#fff}

.sw{position:relative;margin-bottom:8px;border-radius:16px}
.sw-bg{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:750;font-size:15px;opacity:0;transition:background .15s}
.sw.go-done .sw-bg,.sw.go-hold .sw-bg{opacity:1}
.sw.go-done .sw-bg{background:var(--st-done-b);color:#08210F;justify-content:flex-start}
.sw.go-hold .sw-bg{background:var(--st-hold-b);color:#2B2300;justify-content:flex-end}
.sw.go-done .sw-bg .h,.sw.go-hold .sw-bg .d{display:none}
.sw.armed.go-done .sw-bg{background:var(--check);color:#fff}
.sw.armed.go-hold .sw-bg{background:#D9A400;color:#1A1400}
.sw-bg span{display:flex;align-items:center;gap:8px}
.sw-bg svg{width:20px;height:20px}
.card{touch-action:pan-y;user-select:none;-webkit-user-select:none;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 10px;cursor:pointer;position:relative;transition:background .2s,border-color .2s;will-change:transform}
.card.flag::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--ink)}
.card.st-hold{background:var(--st-hold);border-color:var(--st-hold-b)}
.card.st-done{background:var(--st-done);border-color:var(--st-done-b)}
.card.st-difficult{background:var(--st-difficult);border-color:var(--st-difficult-b)}
.card.st-reshoot{background:var(--st-reshoot);border-color:var(--st-reshoot-b)}
.card.next{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.chk{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;margin-top:1px}
.chk svg{width:24px;height:24px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
.card.st-done .chk{background:var(--check);border-color:var(--check);color:#fff}
.card.st-done .chk svg{opacity:1;transform:none}
.cb{flex:1;min-width:0}
.r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.id{font-size:20px;font-weight:780;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.subj{font-size:16.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.card.st-done .subj,.card.st-done .id{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent)}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--ink) 9%,transparent);text-transform:uppercase;letter-spacing:.03em}
.upnext{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--ink);color:var(--bg);text-transform:uppercase;letter-spacing:.03em}
.tech{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tech span{font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:7px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.desc{font-size:14.5px;line-height:1.38;margin-top:7px;color:color-mix(in srgb,var(--ink) 82%,transparent);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.meta .note{color:var(--ink);font-weight:550}
.photos{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.cam{flex:none;position:relative;width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface) center/cover no-repeat;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;margin-top:1px}
.cam svg{width:22px;height:22px}
.cam i{position:absolute;right:3px;bottom:3px;font-style:normal;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:0 5px;line-height:16px}
.card[class*="st-"] .cam:not([data-pid]){background:color-mix(in srgb,var(--surface) 60%,transparent)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px}
.sec h3{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sec small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.take{display:grid;grid-template-columns:36px 72px 1fr 40px 32px;gap:6px;align-items:center;background:var(--surface-2);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:6px}
.take.good{box-shadow:inset 0 0 0 1.5px var(--ink)}
.take b{font-variant-numeric:tabular-nums;font-size:15px}
.take input,.ck input{min-width:0;width:100%;height:38px;border:1px solid transparent;border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 9px;outline:none}
.take input:focus,.ck input:focus{border-color:var(--ink)}
.take .tdur{font-variant-numeric:tabular-nums;text-align:center}
.circ{height:38px;border-radius:9px;border:0;background:transparent;font-size:20px;cursor:pointer;line-height:1}
.x{height:38px;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.takebar{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.takebar .btn{height:50px;font-size:15px}
.btn.rec{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.rec.on{background:#C2372E;border-color:#C2372E;color:#fff}
.btn.rec b{font-variant-numeric:tabular-nums;margin-left:4px}
.ck{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ck .box{flex:none;width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.ck .box svg{width:18px;height:18px;opacity:0}
.ck.on .box{background:var(--check);border-color:var(--check);color:#fff}
.ck.on .box svg{opacity:1}
.ck.on input{text-decoration:line-through;color:var(--muted)}
.ck.add input{background:var(--surface-2)}
.ck.add .btn{height:38px;padding:0 14px;font-size:14.5px}
.rolling{color:#C2372E;font-weight:700}
.rolling b{font-variant-numeric:tabular-nums}
.jump.stop{background:#C2372E;color:#fff}
.jump.stop svg{display:none}
.jump.stop b{font-variant-numeric:tabular-nums;margin-left:4px}
.fields.editf{grid-template-columns:repeat(2,1fr)}
.fld.edit{display:flex;flex-direction:column;gap:3px}
.fld.edit input,.fld.edit textarea,.fld.edit select{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:2px 0;outline:none;-webkit-appearance:none;appearance:none}
.fld.edit textarea{font-weight:500;resize:none;line-height:1.4}
.fld.edit select{text-transform:uppercase;font-size:15px}
.fld.edit:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.btn.danger{color:#C2372E}
.addshot{width:100%;height:46px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:14.5px;font-weight:650;cursor:pointer;margin:0 0 8px}
.ph{flex:none;width:96px;height:96px;border-radius:12px;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line);cursor:pointer;padding:0}
.ph.add{display:grid;place-items:center;color:var(--muted);font-size:12.5px;font-weight:650;background:var(--surface)}
.ph.add svg{width:24px;height:24px;display:block;margin:0 auto 4px}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) var(--padR) calc(14px + env(safe-area-inset-bottom,0px)) var(--padL)}
.viewer[hidden]{display:none}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer .vbar{display:flex;justify-content:space-between;gap:10px;margin:8px 0}
.viewer .btn{background:#1F1F1F;color:#fff;border-color:#333}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0 0}
.alldone{display:flex;align-items:center;gap:10px;margin:12px 0 4px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.alldone svg{width:18px;height:18px;color:var(--check);flex:none}
.empty{max-width:460px;margin:12vh auto 0;padding:0 24px;text-align:center}
.empty h1{font-size:28px;letter-spacing:-.02em;margin:0 0 10px}
.empty p{color:var(--muted);line-height:1.5;margin:0 0 22px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:650;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.wide{width:100%}
.btn svg{width:20px;height:20px}
.finished{text-align:center;padding:40px 20px;color:var(--muted)}
.finished b{display:block;color:var(--ink);font-size:20px;margin-bottom:4px}

/* jump */
.jump{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;height:50px;padding:0 20px;border-radius:25px;border:0;background:var(--ink);color:var(--bg);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
.jump[hidden]{display:none}
.jump svg{width:18px;height:18px}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:8px max(18px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh-head h2{flex:1;margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.sh-head h2 small{display:block;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0;margin-bottom:4px;text-transform:uppercase}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.fld{background:var(--surface-2);border-radius:12px;padding:9px 11px;min-width:0}
.fld span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.fld b{display:block;font-size:15px;font-weight:650;margin-top:2px;overflow-wrap:anywhere}
.fld.wide{grid-column:1/-1}
.fld.wide b{font-weight:500;line-height:1.4}
.sts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 0 12px}
.st{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.st i{width:14px;height:14px;border-radius:4px;border:1px solid}
.st.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lbl{font-size:13px;font-weight:650;color:var(--muted);margin:6px 2px 6px}
textarea.note{width:100%;min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;resize:none;outline:none;line-height:1.4}
textarea.note:focus{border-color:var(--ink)}
.navrow{display:flex;gap:8px;margin-top:14px}
.navrow .btn{flex:1;height:48px;font-size:15px}
.menu .btn{width:100%;justify-content:flex-start;margin-bottom:8px;height:54px}
.menu .btn.danger{color:#C2372E}
.menu p{color:var(--muted);font-size:13.5px;line-height:1.45;margin:4px 2px 14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14.5px;display:none;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
#toast button{background:transparent;border:0;color:var(--bg);font-weight:750;text-decoration:underline;padding:4px;cursor:pointer}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
@media (min-width:700px){ .fields{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="row1">
    <div class="tl"><div class="ttl" id="ttl"></div><div class="sub" id="sub"></div></div>
    <button class="icon" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="prog"><div class="bar"><i id="pbar"></i></div><div class="pnums"><span><b id="pdone">0</b> of <span id="ptot">0</span> shots done</span><span id="prem"></span></div></div>
  <div class="chips" id="chips"></div>
  <div class="seg" id="filter" role="group" aria-label="Show"><button data-f="todo">To do</button><button data-f="all">All</button><button data-f="done">Done</button></div>
  <div class="hint">Swipe right to check off. Swipe left to put on hold.</div>
</header>
<main id="list"></main>
<button class="jump" id="jump" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span id="jumpTxt">Up next</span></button>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<input type="file" id="file" hidden>
<input type="file" id="photoIn" accept="image/*" multiple hidden>
<input type="file" id="photoCam" accept="image/*" capture="environment" hidden>
<div class="viewer" id="viewer" hidden><div class="vbar"><button class="btn" id="vDel">Delete photo</button><button class="btn" id="vClose">Done</button></div><img id="vImg" alt="Shot photo"></div>

<script>
(() => {
"use strict";
const KEY = "onset.v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const FIELDS = ["setup","shot","subject","framing","camera","angle","movement","equipment","lens","sound","setupTime","duration","breakdown","notes"];
const STATUSES = [["done","Done"],["hold","On hold"],["difficult","Difficult"],["reshoot","Reshoot"]];
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

function norm(o){
  const p = Object.assign({title:"", subtitle:"", scenes:[]}, o || {});
  p.scenes = (Array.isArray(p.scenes) ? p.scenes : []).map(sc => {
    sc = Object.assign({}, sc); sc.id = sc.id || uid(); sc.heading = sc.heading || ""; sc.color = sc.color || ""; sc.notes = sc.notes || "";
    sc.rows = (Array.isArray(sc.rows) ? sc.rows : []).map(r => { r = Object.assign({}, r); r.id = r.id || uid(); FIELDS.forEach(k => r[k] = r[k] == null ? "" : String(r[k])); r.status = r.status || ""; r.flag = !!r.flag; r.setNote = r.setNote || ""; r.doneAt = r.doneAt || null; r.photos = Array.isArray(r.photos) ? r.photos.filter(x => typeof x === "string") : []; r.takes = Array.isArray(r.takes) ? r.takes.filter(t => t && typeof t === "object").map(t => ({n:+t.n || 0, dur:+t.dur || 0, good:!!t.good, note:String(t.note || ""), at:t.at || null})) : []; r.checklist = Array.isArray(r.checklist) ? r.checklist.filter(c => c && typeof c === "object").map(c => ({id:c.id || uid(), text:String(c.text || ""), done:!!c.done})) : []; return r; });
    return sc;
  });
  return p;
}
function parseMin(v){
  v = String(v || "").trim().toLowerCase(); if (!v) return 0;
  let m = v.match(/^(\d+):(\d{1,2})$/); if (m) return +m[1] * 60 + +m[2];
  m = v.match(/^(\d+(?:\.\d+)?)\s*h(?:r|rs|ours?)?\s*(?:(\d+(?:\.\d+)?)\s*m?(?:in)?s?)?$/); if (m) return parseFloat(m[1]) * 60 + (m[2] ? parseFloat(m[2]) : 0);
  const n = parseFloat(v); return isNaN(n) ? 0 : n;
}
const rowMin = r => parseMin(r.setupTime) + parseMin(r.duration) + parseMin(r.breakdown);
function fmtMin(m){ m = Math.round(m); if (m < 60) return m + " min"; const h = Math.floor(m / 60), mm = m % 60; return h + " h" + (mm ? " " + mm + " min" : ""); }
function todOf(h){
  h = String(h || "").toUpperCase();
  if (/\b(SUNSET|SUNRISE|DAWN|DUSK|TWILIGHT|GOLDEN HOUR|MAGIC HOUR)\b/.test(h)) return "sunset";
  if (/\b(NIGHT|EVENING|MIDNIGHT|NIGHTTIME)\b/.test(h)) return "night";
  if (/\b(DAY|MORNING|NOON|MIDDAY|AFTERNOON|DAYTIME)\b/.test(h)) return "day";
  return "";
}
function isLight(h){ h = String(h).replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16) || 0; const [r, g, b] = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b > .42; }
function sceneAttr(sc){ if (sc.color) return ' style="background:' + sc.color + ';color:' + (isLight(sc.color) ? "#000" : "#fff") + '"'; const t = todOf(sc.heading); return t ? ' data-tod="' + t + '"' : ""; }
const fmtClock = ts => new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});

/* ---------- state ---------- */
let P = null, F = {scene:"all", filter:"todo"}, undoStack = [], editedSinceLoad = false;
try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && o.project){ P = norm(o.project); Object.assign(F, o.ui || {}); } } catch {}
F.filter = "todo";
function findRow(id){ for (const sc of P.scenes){ const r = sc.rows.find(x => x.id === id); if (r) return {sc, r}; } return null; }
function persist(){ if (P) P.updatedAt = Date.now(); editedSinceLoad = true; try { localStorage.setItem(KEY, JSON.stringify({project:P, ui:F})); } catch {} pushRemote(); }
function saveUI(){ try { localStorage.setItem(KEY, JSON.stringify({project:P, ui:F})); } catch {} }

/* ---------- account sync (when hosted) ---------- */
let remote = null, pushing = false, again = false;
async function pushRemote(){
  if (!remote || !P) return; if (pushing){ again = true; return; }
  const json = JSON.stringify(P); if (json.length > 240000) return;
  pushing = true; try { await remote.set({json, updatedAt:P.updatedAt || Date.now()}); } catch {}
  pushing = false; if (again){ again = false; pushRemote(); }
}
async function initSync(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return; const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/onset"); const snap = await ref.get(); remote = ref;
    if (snap.exists){ const d = snap.data() || {}; if (d.json && (d.updatedAt || 0) > ((P && P.updatedAt) || 0) && !editedSinceLoad){ P = norm(JSON.parse(d.json)); saveUI(); render(); return; } }
    if (P) pushRemote();
  } catch {}
}

/* ---------- render ---------- */
const list = $("#list");
function render(){
  if (!P || !P.scenes.length){ renderEmpty(); return; }
  $("#top").hidden = false;
  $("#ttl").textContent = P.title || "Shot list";
  $("#sub").textContent = P.subtitle || "On set";
  document.title = (P.title || "Shot list") + " · On set";
  if (F.scene !== "all" && !P.scenes.some(s => s.id === F.scene)) F.scene = "all";
  const scenes = F.scene === "all" ? P.scenes : P.scenes.filter(s => s.id === F.scene);
  const rows = scenes.flatMap(s => s.rows), done = rows.filter(r => r.status === "done").length;
  $("#pbar").style.width = (rows.length ? done / rows.length * 100 : 0) + "%";
  $("#pdone").textContent = done; $("#ptot").textContent = rows.length;
  const left = rows.filter(r => r.status !== "done").reduce((a, r) => a + rowMin(r), 0);
  $("#prem").textContent = left ? "About " + fmtMin(left) + " left" : "";
  const allRows = P.scenes.flatMap(s => s.rows);
  $("#chips").innerHTML = '<button class="chip' + (F.scene === "all" ? " on" : "") + '" data-s="all"><span>All scenes</span><small>' + allRows.filter(r => r.status === "done").length + '/' + allRows.length + '</small></button>' +
    P.scenes.map(sc => { const d = sc.rows.filter(r => r.status === "done").length; return '<button class="chip' + (F.scene === sc.id ? " on" : "") + '" data-s="' + sc.id + '"><i class="dot"' + sceneAttr(sc) + '></i><span>' + esc(sc.heading || "Untitled scene") + '</span><small>' + d + '/' + sc.rows.length + '</small></button>'; }).join("");
  document.querySelectorAll("#filter button").forEach(b => b.classList.toggle("on", b.dataset.f === F.filter));
  const next = rows.find(r => r.status !== "done");
  let h = "";
  for (const sc of scenes){
    const vis = sc.rows.filter(r => F.filter === "all" || (F.filter === "done" ? r.status === "done" : r.status !== "done"));
    const d = sc.rows.filter(r => r.status === "done").length;
    if (!vis.length){
      if (F.filter === "todo" && sc.rows.length) h += '<div class="alldone">' + CHECK + '<span><b>' + esc(sc.heading || "Untitled scene") + '</b> is done, all ' + sc.rows.length + ' shots</span></div>';
      continue;
    }
    h += '<div class="scene"' + sceneAttr(sc) + '><b>' + esc(sc.heading || "Untitled scene") + '</b><small>' + d + ' of ' + sc.rows.length + ' done</small></div>';
    h += vis.map(r => cardHTML(r, next && r.id === next.id)).join("");
    if (F.filter !== "done") h += '<button class="addshot" data-add="' + sc.id + '">+ Add shot to this scene</button>';
  }
  if (!h){
    h = F.filter === "done" ? '<div class="finished"><b>Nothing checked off yet</b>Tap the circle on a shot when it’s in the can.</div>'
                            : '<div class="finished"><b>That’s a wrap</b>Every shot here is done.</div>';
  }
  list.innerHTML = h;
  fillCardThumbs();
  const jb = $("#jump");
  if (rolling && findRow(rolling.id)){ jb.hidden = false; jb.classList.add("stop"); $("#jumpTxt").innerHTML = "Stop take " + esc(idOf(findRow(rolling.id).r)) + " <b data-roll>" + fmtDur((Date.now() - rolling.start) / 1000) + "</b>"; return; }
  jb.classList.remove("stop");
  if (next && F.filter !== "done"){ jb.hidden = false; $("#jumpTxt").textContent = "Up next: " + idOf(next); } else jb.hidden = true;
}
const idOf = r => (r.setup || "?") + "." + (r.shot || "?");
function stLabel(v){ const s = STATUSES.find(x => x[0] === v); return s ? s[1] : ""; }
function cardHTML(r, isNext){
  const tech = ["framing","lens","angle","movement","equipment","camera","sound"].map(k => r[k]).filter(Boolean);
  const meta = [];
  if (r.status === "done" && r.doneAt) meta.push("Done " + fmtClock(r.doneAt));
  const m = rowMin(r); if (m) meta.push(fmtMin(m));
  if (r.photos.length) meta.push(plural(r.photos.length, "photo"));
  if (rolling && rolling.id === r.id) meta.push('<span class="rolling">● Rolling <b data-roll>' + fmtDur((Date.now() - rolling.start) / 1000) + '</b></span>');
  if (r.takes.length){ const g = r.takes.filter(t => t.good).length; meta.push(plural(r.takes.length, "take") + (g ? ", " + g + " circled" : "")); }
  if (r.checklist.length) meta.push(r.checklist.filter(c => c.done).length + "/" + r.checklist.length + " checklist");
  if (r.setNote) meta.push('<span class="note">Script: ' + esc(r.setNote) + '</span>');
  return '<div class="sw" data-id="' + r.id + '"><div class="sw-bg"><span class="d">' + CHECK + 'Done</span><span class="h">On hold<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg></span></div><div class="card' + (r.status ? " st-" + r.status : "") + (r.flag ? " flag" : "") + (isNext ? " next" : "") + '" data-id="' + r.id + '" id="r-' + r.id + '">' +
    '<button class="chk" aria-label="' + (r.status === "done" ? "Uncheck " : "Check off ") + esc(idOf(r)) + '">' + CHECK + '</button>' +
    '<div class="cb"><div class="r1"><span class="id">' + esc(idOf(r)) + '</span><span class="subj">' + esc(r.subject || "No subject") + '</span>' +
    (isNext ? '<span class="upnext">Up next</span>' : "") + (r.status && r.status !== "done" ? '<span class="pill">' + stLabel(r.status) + '</span>' : "") + '</div>' +
    (tech.length ? '<div class="tech">' + tech.map(t => '<span>' + esc(t) + '</span>').join("") + '</div>' : "") +
    (r.notes ? '<div class="desc">' + esc(r.notes) + '</div>' : "") +
    (meta.length ? '<div class="meta">' + meta.map(x => x.startsWith("<span") ? x : '<span>' + esc(x) + '</span>').join("") + '</div>' : "") +
    '</div>' + ((r.photos || [])[0] ? '<button class="cam" data-cam="' + r.id + '" data-pid="' + r.photos[0] + '" aria-label="Photos for ' + esc(idOf(r)) + '">' + (r.photos.length > 1 ? '<i>' + r.photos.length + '</i>' : "") + '</button>' : '<button class="cam" data-cam="' + r.id + '" aria-label="Take a photo for ' + esc(idOf(r)) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>') + '</div></div>';
}
function renderEmpty(){
  $("#top").hidden = true; $("#jump").hidden = true;
  list.innerHTML = '<div class="empty"><h1>On set</h1><p>Check off shots from your phone while you shoot. On your computer, open your shot list and choose <b>Export → Save project file</b>. Send that file to your phone (AirDrop, iCloud Drive, email), then import it here.</p><button class="btn primary wide" data-act="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>Import project file</button></div>';
}

/* ---------- actions ---------- */
function snapRow(r){ const o = {id:r.id, status:r.status, doneAt:r.doneAt, setNote:r.setNote, flag:r.flag, photos:(r.photos || []).slice(), takes:JSON.parse(JSON.stringify(r.takes || [])), checklist:JSON.parse(JSON.stringify(r.checklist || []))}; FIELDS.forEach(k => o[k] = r[k]); return o; }
function pushUndo(rows){ undoStack.push(rows.map(snapRow)); if (undoStack.length > 100) undoStack.shift(); }
function undo(){
  const s = undoStack.pop(); if (!s) return;
  if (typeof s === "function"){ s(); persist(); render(); return; }
  s.forEach(x => { const f = findRow(x.id); if (f){ const {id, ...rest} = x; Object.assign(f.r, rest); } });
  persist(); render(); if (sheetRow) openSheet(sheetRow);
}
function buzz(){ try { navigator.vibrate && navigator.vibrate(12); } catch {} }
function setStatus(id, v){
  const f = findRow(id); if (!f) return;
  pushUndo([f.r]);
  const next = f.r.status === v ? "" : v;
  f.r.status = next; f.r.doneAt = next === "done" ? Date.now() : (next ? f.r.doneAt : null);
  if (next !== "done") f.r.doneAt = null;
  persist(); buzz();
  return next;
}
function toggleDone(id){
  const f = findRow(id); if (!f) return;
  const res = setStatus(id, "done");
  const card = document.getElementById("r-" + id), el = card && card.parentElement;
  if (card) card.classList.toggle("st-done", res === "done");
  if (el && F.filter !== "all" && ((F.filter === "todo" && res === "done") || (F.filter === "done" && res !== "done"))){
    el.style.transition = "opacity .25s, transform .25s"; el.style.opacity = "0"; el.style.transform = "scale(.98)";
    setTimeout(render, 260);
  } else render();
  toast(res === "done" ? "Checked off " + idOf(f.r) : "Unchecked " + idOf(f.r), true);
}

/* ---------- editing ---------- */
let editNewId = null;
const EDIT_FIELDS = [["setup","Set-up #"],["shot","Shot #"],["subject","Subject",1],["framing","Framing"],["lens","Lens"],["angle","Angle"],["movement","Movement"],["equipment","Equipment"],["camera","Camera"],["sound","Sound"],["setupTime","Set-up min"],["duration","Shot min"],["breakdown","Breakdown min"],["notes","Description",2]];
const DEFAULT_LISTS = {framing:["EWS","WS","W","MS","MS (OTS)","MCU","CU","ECU","W to CU","Insert"], camera:["A CAM","B CAM","C CAM"], angle:["Eyelevel","High Angle","Low Angle","Extreme Low","Overhead","Dutch","POV","Item"], movement:["Static","Pan","Tilt","Push-In","Pull-Out","Tracking Shot","Crane","Zoom"], equipment:["Sticks / Tripod","Handheld","Dolly","Gimbal","Slider","Steadicam"], lens:["18 mm","24 mm","28 mm","35 mm","50 mm","85 mm","100 mm","135 mm"], sound:["Boom","Lav","MOS","Wild"]};
function listsOf(){ const L = Object.assign({}, DEFAULT_LISTS, (P && P.lists) || {}); return L; }
function openEditor(id){
  const f = findRow(id); if (!f) return; const r = f.r; sheetRow = id; sheetMode = "edit";
  const L = listsOf();
  const inp = ([k, l, w]) => {
    const list = Array.isArray(L[k]) && L[k].length ? ' list="dl-' + k + '"' : "";
    const mode = ["setupTime","duration","breakdown"].includes(k) ? ' inputmode="decimal"' : "";
    return '<label class="fld edit' + (w ? " wide" : "") + '"><span>' + l + '</span>' + (w === 2 ? '<textarea data-k="' + k + '" rows="3">' + esc(r[k]) + '</textarea>' : '<input data-k="' + k + '" value="' + esc(r[k]) + '"' + list + mode + ' autocomplete="off" autocorrect="off" autocapitalize="' + (k === "subject" ? "words" : "off") + '">') + '</label>';
  };
  const dls = Object.keys(L).filter(k => Array.isArray(L[k])).map(k => '<datalist id="dl-' + k + '">' + L[k].map(o => '<option value="' + esc(o) + '">').join("") + '</datalist>').join("");
  const scOpts = P.scenes.map(x => '<option value="' + x.id + '"' + (x.id === f.sc.id ? " selected" : "") + '>' + esc(x.heading || "Untitled scene") + '</option>').join("");
  const isNew = editNewId === id;
  sheet.innerHTML = '<div class="grab"></div><div class="sh-head"><h2><small>' + (isNew ? "New shot" : "Edit shot") + '</small>' + esc(idOf(r)) + '</h2><button class="icon" data-act="canceledit" aria-label="Cancel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="fields editf"><label class="fld edit wide"><span>Scene</span><select data-k="_scene">' + scOpts + '</select></label>' + EDIT_FIELDS.map(inp).join("") + '</div>' + dls +
    '<div class="navrow"><button class="btn" data-act="canceledit">Cancel</button><button class="btn primary" data-act="saveedit">' + (isNew ? "Add shot" : "Save") + '</button></div>' +
    (isNew ? "" : '<button class="btn wide danger" data-act="delshot" style="margin-top:10px">Delete shot</button>');
  if (!sheet.classList.contains("show")) showSheet();
  sheet.scrollTop = 0;
}
function saveEditor(){
  const f = findRow(sheetRow); if (!f) return;
  const wasNew = editNewId === f.r.id;
  if (!wasNew) pushUndo([f.r]);
  sheet.querySelectorAll("[data-k]").forEach(el => { const k = el.dataset.k; if (k === "_scene") return; f.r[k] = k === "notes" ? el.value.replace(/\s+$/, "") : el.value.trim(); });
  const to = sheet.querySelector('[data-k="_scene"]').value;
  if (to !== f.sc.id){ const dest = P.scenes.find(x => x.id === to); if (dest){ f.sc.rows = f.sc.rows.filter(x => x !== f.r); dest.rows.push(f.r); } }
  const L = P.lists || (P.lists = {});
  ["framing","lens","angle","movement","equipment","camera","sound"].forEach(k => { const v = f.r[k]; if (v){ L[k] = L[k] || (DEFAULT_LISTS[k] || []).slice(); if (!L[k].some(o => o.toLowerCase() === v.toLowerCase())) L[k].push(v); } });
  editNewId = null;
  persist(); render(); openSheet(f.r.id);
  toast(wasNew ? "Added " + idOf(f.r) : "Saved " + idOf(f.r), !wasNew);
}
function cancelEditor(){
  if (editNewId && editNewId === sheetRow){ closeSheet(); return; }
  openSheet(sheetRow);
}
function addShot(scId){
  const sc = P.scenes.find(x => x.id === scId); if (!sc) return;
  const all = P.scenes.flatMap(x => x.rows), last = sc.rows[sc.rows.length - 1];
  const r = {id:uid(), status:"", flag:false, setNote:"", doneAt:null, photos:[]}; FIELDS.forEach(k => r[k] = "");
  if (last){
    ["setup","framing","camera","angle","movement","equipment","lens","sound"].forEach(k => r[k] = last[k]);
    r.shot = String(Math.max(0, ...all.filter(x => x.setup.trim() === r.setup.trim()).map(x => parseFloat(x.shot) || 0)) + 1);
  } else { r.camera = "A CAM"; r.setup = String(Math.max(0, ...all.map(x => parseFloat(x.setup) || 0)) + 1); r.shot = "1"; }
  sc.rows.push(r); editNewId = r.id; openEditor(r.id);
}
function deleteShot(id){
  const f = findRow(id); if (!f) return; const idx = f.sc.rows.indexOf(f.r), sc = f.sc, row = f.r;
  confirmSheet("Delete shot " + idOf(row) + "?", "It will be removed from this phone’s shot list. You can undo right after.", "Delete shot", () => {
    sc.rows = sc.rows.filter(x => x !== row);
    undoStack.push(() => { sc.rows.splice(Math.min(idx, sc.rows.length), 0, row); });
    persist(); render(); toast("Deleted " + idOf(row), true);
  });
}

/* ---------- takes, timer, checklist ---------- */
let rolling = null;
try { rolling = JSON.parse(localStorage.getItem("onset.roll") || "null"); } catch {}
function saveRoll(){ try { localStorage.setItem("onset.roll", JSON.stringify(rolling)); } catch {} }
function fmtDur(sec){ sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); }
function parseDur(v){ v = String(v || "").trim(); if (!v) return 0; const p = v.split(":").map(x => parseFloat(x) || 0); if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2]; if (p.length === 2) return p[0] * 60 + p[1]; return parseFloat(v.replace(/[^\d.]/g, "")) || 0; }
function takesHTML(r){
  const run = rolling && rolling.id === r.id;
  return '<div class="sec"><h3>Takes</h3>' + (r.takes.length ? '<small>' + plural(r.takes.length, "take") + (r.takes.some(t => t.good) ? ", " + r.takes.filter(t => t.good).length + " circled" : "") + '</small>' : "") + '</div>' +
    r.takes.map((t, i) => '<div class="take' + (t.good ? " good" : "") + '"><b>T' + t.n + '</b><input class="tdur" data-take-dur="' + i + '" value="' + (t.dur ? fmtDur(t.dur) : "") + '" placeholder="0:00" inputmode="numeric" aria-label="Take ' + t.n + ' length"><input class="tnote" data-take-note="' + i + '" value="' + esc(t.note) + '" placeholder="Note" aria-label="Take ' + t.n + ' note"><button class="circ" data-take-good="' + i + '" aria-pressed="' + t.good + '" aria-label="Circle take ' + t.n + '">' + (t.good ? "●" : "○") + '</button><button class="x" data-take-del="' + i + '" aria-label="Delete take ' + t.n + '">×</button></div>').join("") +

/* ---------- import / export ---------- */
let pending = null;
async function importFile(file){
  try {
    const o = JSON.parse(await file.text());
    if (!o || !Array.isArray(o.scenes)) throw new Error();
    if (o.photos && typeof o.photos === "object"){ for (const [id, d] of Object.entries(o.photos)) if (typeof d === "string" && d.startsWith("data:image")) await putPhoto(id, d); delete o.photos; }
    const p = norm(o);
    if (P && P.scenes.length){
      pending = p; closeSheet();
      confirmSheet("Replace this project?", "“" + (p.title || file.name) + "” will replace “" + (P.title || "the current list") + "” on this phone, including its check marks.", "Replace", () => { P = pending; pending = null; F.scene = "all"; F.filter = "todo"; undoStack = []; persist(); render(); toast("Imported " + plural(P.scenes.reduce((a, s) => a + s.rows.length, 0), "shot")); });
      return;
    }
    P = p; F.scene = "all"; F.filter = "todo"; undoStack = []; persist(); closeSheet(); render();
    toast("Imported " + plural(P.scenes.reduce((a, s) => a + s.rows.length, 0), "shot") + ". Swipe right to check off, left to hold.");
  } catch { toast("That isn’t a shot list project file. Export it from the shot list with Save project file."); }
}
function fileBase(){ return ((P && P.title) || "Shot list").replace(/[\\/:*?"<>|]+/g, "").trim().replace(/\s+/g, "_") || "Shot_list"; }
async function exportProject(){
  const out = Object.assign({}, P), photos = {};
  for (const r of P.scenes.flatMap(s => s.rows)) for (const pid of r.photos){ const d = await getPhoto(pid); if (d) photos[pid] = d; }
  if (Object.keys(photos).length) out.photos = photos;
  const name = fileBase() + ".shotlist.json", blob = new Blob([JSON.stringify(out)], {type:"application/json"});
  let dl = null;
  try { if (window.claude && typeof window.claude.use === "function") dl = await window.claude.use("downloads"); } catch {}
  if (dl){ try { await dl.save({filename:name, data:blob}); closeSheet(); toast("Saved " + name); } catch (e){ if (!e || (e.code !== "declined" && e.code !== "cancelled")) toast("Couldn’t save the file."); } return; }
  try {
    const f = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); closeSheet(); return; }
  } catch (e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  closeSheet(); toast("Saved " + name);
}

/* ---------- photos (stored on this device) ---------- */
const photoCache = new Map();
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open("shotlist-photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("p"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e){ rej(e); } }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("p", mode), req = fn(t.objectStore("p")); t.oncomplete = () => res(req && "result" in req ? req.result : undefined); t.onerror = () => rej(t.error); }); };
  return {get:k => run("readonly", st => st.get(k)), set:(k, v) => run("readwrite", st => st.put(v, k)), del:k => run("readwrite", st => st.delete(k))};
})();
async function getPhoto(id){ if (photoCache.has(id)) return photoCache.get(id); try { const d = await idb.get(id); if (d) photoCache.set(id, d); return d || null; } catch { return null; } }
async function putPhoto(id, d){ photoCache.set(id, d); try { await idb.set(id, d); } catch {} }
function readImage(file, maxBytes = 180000){
  return new Promise((res, rej) => {
    if (file.type && !file.type.startsWith("image/")){ rej(new Error("type")); return; }
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      let max = 1280, q = .72, out = "";
      for (let i = 0; i < 10; i++){
        const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length * .75 <= maxBytes) break;
        if (q > .52) q -= .1; else max = Math.round(max * .8);
      }
      res(out);
    }; img.onerror = () => rej(new Error("img")); img.src = fr.result; };
    fr.onerror = () => rej(new Error("read")); fr.readAsDataURL(file);
  });
}
let photoTarget = null;
async function addPhotosTo(id, files){
  const f = findRow(id); if (!f || !files.length) return;
  toast(files.length === 1 ? "Adding photo…" : "Adding " + files.length + " photos…");
  let added = 0;
  for (const file of files){ try { const d = await readImage(file), pid = "ph_" + uid() + uid(); await putPhoto(pid, d); f.r.photos.push(pid); added++; } catch {} }
  if (added){ persist(); render(); if (sheetRow === id && sheetMode === "shot") openSheet(id, true); toast((added === 1 ? "Photo added to " : added + " photos added to ") + idOf(f.r)); }
  else toast("That photo couldn’t be read. Try a JPEG or PNG.");
}
["#photoIn", "#photoCam"].forEach(sel => $(sel).addEventListener("change", e => { const files = [...e.target.files]; e.target.value = ""; const id = photoTarget || sheetRow; photoTarget = null; if (id) addPhotosTo(id, files); }));

/* ---------- swipe ---------- */
let sw = null, suppressClick = false;
const swTh = card => Math.min(110, card.offsetWidth * .3);
list.addEventListener("pointerdown", e => {
  const card = e.target.closest(".card"); if (!card || e.target.closest(".chk, .cam")) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  sw = {card, wrap:card.parentElement, id:card.dataset.id, x0:e.clientX, y0:e.clientY, dx:0, active:false, armed:false, pid:e.pointerId};
});
list.addEventListener("pointermove", e => {
  if (!sw || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.active){
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3){ sw.active = true; try { sw.card.setPointerCapture(e.pointerId); } catch {} sw.card.style.transition = "none"; }
    else { if (Math.abs(dy) > 12) sw = null; return; }
  }
  sw.dx = dx; sw.card.style.transform = "translateX(" + dx + "px)";
  sw.wrap.classList.toggle("go-done", dx > 0); sw.wrap.classList.toggle("go-hold", dx < 0);
  const armed = Math.abs(dx) > swTh(sw.card); if (armed !== sw.armed){ sw.armed = armed; sw.wrap.classList.toggle("armed", armed); if (armed) buzz(); }
});
function endSwipe(){
  if (!sw) return; const s = sw; sw = null; if (!s.active) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 400);
  if (Math.abs(s.dx) > swTh(s.card)){
    const w = s.card.offsetWidth + 40; s.card.style.transition = "transform .18s ease-in"; s.card.style.transform = "translateX(" + (s.dx > 0 ? w : -w) + "px)";
    setTimeout(() => swipeTo(s.id, s.dx > 0 ? "done" : "hold"), 170);
  } else {
    s.card.style.transition = "transform .2s"; s.card.style.transform = "";
    setTimeout(() => s.wrap.classList.remove("go-done", "go-hold", "armed"), 200);
  }
}
list.addEventListener("pointerup", endSwipe);
list.addEventListener("pointercancel", endSwipe);
function swipeTo(id, v){
  const f = findRow(id); if (!f) return;
  pushUndo([f.r]);
  if (f.r.status !== v){ f.r.status = v; f.r.doneAt = v === "done" ? Date.now() : null; }
  persist(); render();
  toast((v === "done" ? "Checked off " : "On hold: ") + idOf(f.r), true);
}

  if (withUndo) t.querySelector("button").onclick = () => { undo(); t.style.display = "none"; };
  t.style.display = "flex"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", withUndo ? 4000 : 2600);

  }
});
sheet.addEventListener("focusout", e => { if (e.target.matches && e.target.matches("textarea.note") && sheetRow) saveNote(e.target.value); });
sheet.addEventListener("change", e => {
  const t = e.target, f = sheetRow && findRow(sheetRow); if (!f) return;
  if (t.dataset.takeDur != null){ const i = +t.dataset.takeDur; pushUndo([f.r]); f.r.takes[i].dur = Math.round(parseDur(t.value)); t.value = f.r.takes[i].dur ? fmtDur(f.r.takes[i].dur) : ""; persist(); render(); }
  else if (t.dataset.takeNote != null){ const i = +t.dataset.takeNote; pushUndo([f.r]); f.r.takes[i].note = t.value.trim(); persist(); }
  else if (t.dataset.ckText != null){ const i = +t.dataset.ckText; pushUndo([f.r]); const v = t.value.trim(); if (v) f.r.checklist[i].text = v; else f.r.checklist.splice(i, 1); persist(); render(); if (!v) openSheet(f.r.id, true); }
});
sheet.addEventListener("keydown", e => { if (e.target.id === "ckNew" && e.key === "Enter"){ e.preventDefault(); addItem(); } else if (e.target.matches && e.target.matches(".take input, .ck input") && e.key === "Enter"){ e.preventDefault(); e.target.blur(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheet.classList.contains("show")) closeSheet();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !(e.target && e.target.matches && e.target.matches("textarea,input"))){ e.preventDefault(); undo(); }
});
let startY = null;
sheet.addEventListener("touchstart", e => { if (sheet.scrollTop <= 0) startY = e.touches[0].clientY; else startY = null; }, {passive:true});
sheet.addEventListener("touchend", e => { if (startY != null && e.changedTouches[0].clientY - startY > 90) closeSheet(); startY = null; }, {passive:true});
$("#file").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importFile(f); });
document.addEventListener("dragover", e => { if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files")) e.preventDefault(); });
document.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]){ e.preventDefault(); importFile(e.dataTransfer.files[0]); } });

render();
tick();
initSync();
})();
</script>
</body>
</html>
